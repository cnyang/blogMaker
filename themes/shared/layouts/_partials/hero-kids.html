<g class="stars"><circle cx="160" cy="70" r="3"/><circle cx="420" cy="40" r="2.500"/><circle cx="640" cy="110" r="3"/><circle cx="860" cy="50" r="2.500"/><circle cx="1020" cy="150" r="2.500"/><circle cx="1340" cy="60" r="3"/><circle cx="300" cy="150" r="2.500"/></g>
<g transform="translate(440 0)"><g class="cloud c2"><ellipse cx="880" cy="84" rx="58" ry="22"/><circle cx="858" cy="70" r="24"/><circle cx="902" cy="64" r="30"/></g></g>

<path class="hill-mid" d="M0 350C300 280 600 390 900 330S1300 300 1440 350V420H0Z"/>

<circle class="cheek" cx="36" cy="70" r="6"/><circle class="cheek" cx="84" cy="70" r="6"/>

<div class="wrap hero-copy">
<h1>{{ site.Title }}</h1>
<p>{{ site.Params.tagline }}</p>
<nav class="jump" aria-label="影片分類">{{ range site.Data.kinds.order }}{{ $kind := index site.Data.kinds . }}
<a class="kind-{{ . }}" href="#{{ . }}"><svg viewBox="0 0 24 24" aria-hidden="true">{{ $kind.icon | safeHTML }}</svg>{{ $kind.label }}</a>{{ end }}
</nav>
</div>
</section>
