name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.169.0
  HUGO_SHA256: 2d2f0bfe357d8cb4cec02f6bb28a3bff34978c8dda44b618029c5eb9d66765a7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tgz" | sha256sum -c -
          tar -xzf hugo.tgz hugo
          sudo mv hugo /usr/local/bin/hugo
      - name: Check
        run: ./scripts/check.sh
      - name: Build
        env:
          # 預覽站不給搜尋引擎收錄；廣告只在 Cloudflare 啟用
          HUGO_PARAMS_NOINDEX: "true"
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          for s in kids tech; do
            hugo -s "$s" --themesDir ../themes --minify --baseURL "$base/$s/" --destination "$PWD/_site/$s"
          done
          printf '<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Preview</title><a href="kids/">兒童站</a> | <a href="tech/">技術站</a></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
